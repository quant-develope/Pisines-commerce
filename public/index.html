<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>Σπάρτακος · Προσφορές</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Προσφορές">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="/logo.png" alt="" width="40" height="40"><div><b>ΣΠΑΡΤΑΚΟΣ</b><span data-t="appName"></span></div></div>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="ru">RU</button><button type="button" data-lang="el">ΕΛ</button>
  </div>
</header>
<nav class="tabs" id="tabs" hidden>
  <button type="button" data-view="offer" data-t="tabOffer"></button>
  <button type="button" data-view="materials" data-t="tabMaterials"></button>
  <button type="button" data-view="archive" data-t="tabArchive"></button>
  <button type="button" data-view="settings" data-t="tabSettings"></button>
</nav>
<main id="app"><p class="loading">…</p></main>
<div class="toast" id="toast" role="status" hidden></div>
<div class="pv" id="pv" hidden role="dialog" aria-modal="true">
  <div class="pv-top">
    <div class="row"><button class="btn small" id="pvClose" type="button" aria-label="Close">✕</button>
      <button class="btn small" id="pvEditBtn" type="button" data-t="fmtEdit"></button></div>
    <div class="pv-opts"><label class="signtog" id="pvSignBox"><input type="checkbox" id="pvSign"><span data-t="signShort"></span></label>
      <div class="lang"><button type="button" data-pvlang="el">ΕΛ</button><button type="button" data-pvlang="en">EN</button></div></div>
  </div>
  <div class="pv-pages" id="pvPages"></div>
  <div class="pv-edit" id="pvEdit" hidden></div>
  <div class="pv-bot" id="pvBot">
    <button class="btn" id="pvDl" type="button" data-t="download"></button>
    <button class="btn main" id="pvShare" type="button" data-t="sendApps"></button>
  </div>
</div>
<script src="/vendor/pdfmake.min.js" defer></script>
<script src="/vendor/vfs_fonts.js" defer></script>
<script src="/vendor/pdf.min.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
